name: Smart Class APK and Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # ANDROID APK
  # ============================================================

  build-android:
    name: Build Smart Class Android APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Get latest code from main
      # ----------------------------------------------------------

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------------------------
      # Java 21
      # ----------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Java
        run: |
          java -version
          javac -version

      # ----------------------------------------------------------
      # Android SDK
      # ----------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------------------------
      # Install project dependencies
      # ----------------------------------------------------------

      - name: Install project dependencies
        run: npm install

      # ----------------------------------------------------------
      # Build the original Smart Class application
      # ----------------------------------------------------------

      - name: Build Smart Class web application
        run: npm run build

      # ----------------------------------------------------------
      # Install Capacitor
      # ----------------------------------------------------------

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # ----------------------------------------------------------
      # Create Capacitor configuration
      # ----------------------------------------------------------

      - name: Initialize Capacitor
        run: |
          npx cap init "Smart Class" "com.piyush.smartclass" --web-dir dist

      # ----------------------------------------------------------
      # Create Android project
      # ----------------------------------------------------------

      - name: Add Android platform
        run: |
          npx cap add android

      # ----------------------------------------------------------
      # Copy web application into Android project
      # ----------------------------------------------------------

      - name: Sync Android project
        run: |
          npx cap sync android

      # ----------------------------------------------------------
      # Build APK
      # ----------------------------------------------------------

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ----------------------------------------------------------
      # Prepare APK
      # ----------------------------------------------------------

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             apk-output/Smart-Class.apk

      # ----------------------------------------------------------
      # Upload APK
      # ----------------------------------------------------------

      - name: Upload Smart Class APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Class-APK
          path: apk-output/Smart-Class.apk
          if-no-files-found: error


  # ============================================================
  # WINDOWS EXE
  # ============================================================

  build-windows:
    name: Build Smart Class Windows App
    runs-on: windows-latest

    steps:

      # ----------------------------------------------------------
      # Get latest code from main
      # ----------------------------------------------------------

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------------------------
      # Install project dependencies
      # ----------------------------------------------------------

      - name: Install project dependencies
        run: npm install

      # ----------------------------------------------------------
      # Build Smart Class web application
      # ----------------------------------------------------------

      - name: Build Smart Class web application
        run: npm run build

      # ----------------------------------------------------------
      # Copy Vite build
      # ----------------------------------------------------------

      - name: Prepare web application
        shell: pwsh
        run: |
          if (Test-Path "web-dist") {
            Remove-Item "web-dist" -Recurse -Force
          }

          Copy-Item "dist" "web-dist" -Recurse

      # ----------------------------------------------------------
      # Install Electron
      # ----------------------------------------------------------

      - name: Install Electron and Electron Builder
        run: |
          npm install --save-dev electron electron-builder

      # ----------------------------------------------------------
      # Create Electron main process
      # ----------------------------------------------------------

      - name: Create Electron main process
        shell: pwsh
        run: |
          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {

            const window = new BrowserWindow({

              width: 1440,
              height: 900,

              minWidth: 900,
              minHeight: 600,

              backgroundColor: '#050505',

              autoHideMenuBar: true,

              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }

            });

            window.loadFile(
              path.join(
                __dirname,
                'web-dist',
                'index.html'
              )
            );

          }

          app.whenReady().then(() => {

            createWindow();

            app.on('activate', () => {

              if (
                BrowserWindow.getAllWindows().length === 0
              ) {
                createWindow();
              }

            });

          });

          app.on('window-all-closed', () => {

            if (process.platform !== 'darwin') {
              app.quit();
            }

          });
          '@ | Out-File `
            -FilePath electron-main.cjs `
            -Encoding utf8

      # ----------------------------------------------------------
      # Create Electron configuration
      # ----------------------------------------------------------

      - name: Create Electron configuration
        shell: pwsh
        run: |
          @'
          {
            "name": "smart-class-desktop",
            "version": "1.0.0",
            "description": "Smart Class",
            "main": "electron-main.cjs",

            "scripts": {
              "start": "electron .",
              "build:windows": "electron-builder --win --publish never"
            },

            "build": {

              "appId": "com.piyush.smartclass",

              "productName": "Smart Class",

              "directories": {
                "output": "release"
              },

              "files": [
                "web-dist/**/*",
                "electron-main.cjs",
                "package.json"
              ],

              "win": {

                "target": [

                  {
                    "target": "nsis",
                    "arch": [
                      "x64"
                    ]
                  },

                  {
                    "target": "portable",
                    "arch": [
                      "x64"
                    ]
                  }

                ]

              },

              "nsis": {

                "oneClick": false,

                "allowToChangeInstallationDirectory": true,

                "createDesktopShortcut": true,

                "createStartMenuShortcut": true,

                "shortcutName": "Smart Class"

              }

            }

          }
          '@ | Out-File `
            -FilePath electron-package.json `
            -Encoding utf8

      # ----------------------------------------------------------
      # Prepare Electron package
      # ----------------------------------------------------------

      - name: Prepare Electron package
        shell: pwsh
        run: |
          Copy-Item `
            electron-package.json `
            package.json `
            -Force

      # ----------------------------------------------------------
      # Build Windows application
      #
      # --publish never is important.
      # It prevents Electron Builder from asking for a
      # GitHub Personal Access Token.
      # ----------------------------------------------------------

      - name: Build Windows application
        run: |
          npx electron-builder --win --publish never

      # ----------------------------------------------------------
      # Verify Windows build
      # ----------------------------------------------------------

      - name: Verify Windows build
        shell: pwsh
        run: |
          if (!(Test-Path "release")) {
            Write-Error "Windows release directory was not created."
            exit 1
          }

          Get-ChildItem "release" -Recurse

      # ----------------------------------------------------------
      # Upload Windows applications
      # ----------------------------------------------------------

      - name: Upload Smart Class Windows applications
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Class-Windows
          path: release/*.exe
          if-no-files-found: error
